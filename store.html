<!DOCTYPE html>
<html lang="vi" class="dark">
<head>

    <title>Cửa Hàng Độc Bản - Crazy Toy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#f59e0b',
                            dark: '#0f172a',
                            card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {

            border: 1px solid rgba(245, 158, 11, 0.2);
        }
    </style>
</head>

        <div class="w-16 h-16 rounded-2xl glass-panel flex items-center justify-center overflow-hidden shadow-lg shadow-brand-gold/20 border border-brand-gold/40">

        </div>
        <div>

        </div>

                <i class="fa-brands fa-facebook text-sm"></i>
            </a>
            <a href="https://shopee.vn/" target="_blank" class="w-10 h-10 rounded-xl glass-panel flex items-center justify-center text-brand-gold hover:bg-brand-gold/20 transition">
                <i class="fa-solid fa-bag-shopping text-sm"></i>
            </a>
        </div>
    </header>

            <div class="flex items-center space-x-2 text-brand-gold font-bold text-xs uppercase tracking-wider">
